<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e16">
<title>Cámara · Diseñador Apik-Desing</title>
<link rel="icon" href="icons/favicon.png">
<!-- El teléfono como cámara del Estudio de video: graba aquí con toda la calidad del teléfono
     y al terminar manda el archivo completo a la compu (directo, sin subirlo a ningún servidor). -->
<style>
  :root{--fondo:#0b0e16;--panel:#151a25;--borde:#262d3d;--texto:#e8edf6;--suave:#93a0b8;--neon:#19c8ff;--rojo:#ff3b30}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--fondo);color:var(--texto);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;min-height:100%;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--borde)}
  header img{width:32px;height:32px;border-radius:8px}
  header b{font-size:15px}
  main{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 16px 20px;max-width:640px;width:100%;margin:0 auto}
  .vista{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:3/4;max-height:58vh;display:flex;align-items:center;justify-content:center}
  .vista video{width:100%;height:100%;object-fit:contain}
  .vista video.espejo{transform:scaleX(-1)}
  #rec{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.6);border:1px solid var(--rojo);color:#fff;border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
  #rec[hidden]{display:none}
  #rec::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--rojo);animation:lat 1s infinite}
  #rec.pausa::before{animation:none;background:#facc15}
  @keyframes lat{50%{opacity:.3}}
  #estado{margin:0;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--borde);font-weight:600}
  #estado.ok{border-color:#22c55e;color:#bbf7d0}
  #estado.mal{border-color:var(--rojo);color:#fecaca}
  .prog{height:10px;border-radius:5px;background:var(--panel);overflow:hidden}
  .prog[hidden]{display:none}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),#a855f7);transition:width .2s}
  .ctrls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button,select{font:inherit;color:var(--texto);background:var(--panel);border:1px solid var(--borde);border-radius:12px;padding:12px;min-height:48px}
  button:disabled,select:disabled{opacity:.45}
  button.prin{background:linear-gradient(90deg,#ff6a2b,#ff3d7f);border:0;font-weight:700}
  button[hidden]{display:none}
  .hint{color:var(--suave);font-size:13px;margin:0}
  .hint b{color:var(--texto)}
</style>
</head>
<body>
<header><img src="icons/icono-192.png" alt=""><b>Cámara para el Diseñador</b></header>
<main>
  <div class="vista"><video id="v" autoplay muted playsinline></video><div id="rec" hidden>GRABANDO <span id="recT">0:00</span></div></div>
  <p id="estado">Preparando la cámara…</p>
  <div class="prog" id="prog" hidden><i></i></div>
  <div class="ctrls">
    <button id="bGirar">🔄 Cambiar cámara</button>
    <select id="calidad" aria-label="Calidad">
      <option value="720">720p (ligero)</option>
      <option value="1080" selected>1080p Full HD</option>
      <option value="2160">4K (archivo pesado)</option>
    </select>
  </div>
  <button id="bGuardar" class="prin" hidden>⬇ Guardar también en este teléfono</button>
  <p class="hint">La grabación se controla desde la compu. Deja esta pantalla abierta y el teléfono conectado al cargador si vas a grabar mucho tiempo. <b>La cámara trasera tiene mejor calidad.</b></p>
</main>
<script src="config.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const codigo = (location.hash || '').slice(1).trim();
  const estado = (t, clase) => { const e = $('estado'); e.textContent = t; e.className = clase || ''; };
  const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  let stream = null, frente = true, pc = null, dc = null, sender = null, rec = null, partes = [], seg = 0, reloj = null, ultimo = null, wake = null;

  /* ---------- señal (para encontrarse con la compu): Firebase ---------- */
  let dbP = null;
  function db(){
    if (dbP) return dbP;
    const cfg = window.APIK_CONFIG && window.APIK_CONFIG.firebase;
    const V = '10.14.1', cargar = u => new Promise((ok, mal) => { const s = document.createElement('script'); s.src = u; s.onload = ok; s.onerror = () => mal(new Error('Sin conexión')); document.head.appendChild(s); });
    dbP = (async () => {
      if (!cfg) throw new Error('La nube no está configurada');
      if (!window.firebase) for (const n of ['app', 'firestore']) await cargar(`https://www.gstatic.com/firebasejs/${V}/firebase-${n}-compat.js`);
      if (!firebase.apps.length) firebase.initializeApp(cfg);
      return firebase.firestore();
    })();
    return dbP;
  }
  const SENAL = window.__SENAL_PRUEBA || {
    async leer(c){ const d = await (await db()).collection('camaras').doc(c).get(); return d.exists ? d.data() : null; },
    async responder(c, answer){ await (await db()).collection('camaras').doc(c).update({ answer }); }
  };

  /* ---------- cámara ---------- */
  const alto = () => +$('calidad').value;
  async function abrirCamara(){
    const h = alto(), w = Math.round(h * 16 / 9);
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:frente ? 'user' : 'environment', width:{ ideal:w }, height:{ ideal:h }, frameRate:{ ideal:30 } },
      audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true }
    });
    $('v').srcObject = stream; $('v').classList.toggle('espejo', frente);
    if (sender) await sender.replaceTrack(stream.getVideoTracks()[0]);
    mandarInfo();
  }
  function infoCamara(){
    const s = stream ? stream.getVideoTracks()[0].getSettings() : {};
    return { camara:frente ? 'frontal' : 'trasera', res:(s.width || '?') + '×' + (s.height || '?') };
  }
  function mandarInfo(){ if (dc && dc.readyState === 'open') dc.send(JSON.stringify({ t:'info', ...infoCamara() })); }
  $('bGirar').onclick = async () => { frente = !frente; try { await abrirCamara(); } catch (e) { frente = !frente; estado('No se pudo cambiar de cámara', 'mal'); } };
  $('calidad').onchange = async () => { try { await abrirCamara(); } catch (e) { estado('Esta calidad no está disponible en tu teléfono', 'mal'); } };

  /* ---------- grabar aquí, con toda la calidad ---------- */
  const TIPOS = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  function grabar(){
    if (rec && rec.state !== 'inactive') return;
    const mime = TIPOS.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
    const bps = { 720:5e6, 1080:10e6, 2160:30e6 }[alto()] || 10e6;
    partes = []; seg = 0; ultimo = null; $('bGuardar').hidden = true;
    rec = new MediaRecorder(stream, mime ? { mimeType:mime, videoBitsPerSecond:bps, audioBitsPerSecond:160000 } : {});
    rec.ondataavailable = e => e.data.size && partes.push(e.data);
    rec.start(1000);
    dc.send(JSON.stringify({ t:'grabando' }));
    $('rec').hidden = false; $('rec').classList.remove('pausa'); $('bGirar').disabled = $('calidad').disabled = true;
    reloj = setInterval(() => { if (rec && rec.state === 'recording'){ seg += 0.25; $('recT').textContent = fmt(seg); } }, 250);
    estado('● Grabando con ' + infoCamara().res + '. No salgas de esta pantalla.', 'ok');
  }
  async function detener(){
    if (!rec || rec.state === 'inactive') return;
    await new Promise(ok => { rec.onstop = ok; rec.stop(); });
    clearInterval(reloj); $('rec').hidden = true; $('bGirar').disabled = $('calidad').disabled = false;
    ultimo = new Blob(partes, { type:(rec.mimeType || 'video/webm').split(';')[0] });
    $('bGuardar').hidden = false;
    try { await enviar(ultimo); estado('✓ Video enviado a la compu (' + (ultimo.size / 1048576).toFixed(1) + ' MB). Puedes grabar otro.', 'ok'); }
    catch (e) { estado('No se pudo enviar a la compu. Usa «Guardar en este teléfono» y súbelo después.', 'mal'); }
    finally { $('prog').hidden = true; }
  }
  async function enviar(blob){
    if (!dc || dc.readyState !== 'open') throw new Error('sin conexión');
    $('prog').hidden = false; estado('Enviando el video a la compu…');
    dc.send(JSON.stringify({ t:'archivo', tam:blob.size, tipo:blob.type, dur:seg, ...infoCamara() }));
    const TROZO = 64 * 1024, BLOQUE = 4 * 1024 * 1024;
    dc.bufferedAmountLowThreshold = 1024 * 1024;
    for (let b = 0; b < blob.size; b += BLOQUE){
      const buf = new Uint8Array(await blob.slice(b, b + BLOQUE).arrayBuffer());
      for (let i = 0; i < buf.length; i += TROZO){
        if (dc.readyState !== 'open') throw new Error('se cortó');
        if (dc.bufferedAmount > 8 * 1024 * 1024) await new Promise(ok => { dc.onbufferedamountlow = () => { dc.onbufferedamountlow = null; ok(); }; });
        dc.send(buf.subarray(i, i + TROZO));
      }
      const p = Math.min(1, (b + BLOQUE) / blob.size);
      $('prog').querySelector('i').style.width = (p * 100) + '%'; estado('Enviando el video a la compu… ' + Math.round(p * 100) + '%');
    }
    dc.send(JSON.stringify({ t:'fin' }));
  }
  $('bGuardar').onclick = () => {
    if (!ultimo) return;
    const a = document.createElement('a'); a.href = URL.createObjectURL(ultimo);
    a.download = 'camara-' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-') + (ultimo.type.includes('mp4') ? '.mp4' : '.webm');
    document.body.appendChild(a); a.click(); a.remove();
  };

  /* ---------- conectar con la compu (WebRTC) ---------- */
  function esperarICE(p, ms){ return new Promise(ok => { if (p.iceGatheringState === 'complete') return ok(); const t = setTimeout(ok, ms); p.addEventListener('icegatheringstatechange', () => { if (p.iceGatheringState === 'complete'){ clearTimeout(t); ok(); } }); }); }
  async function conectar(){
    estado('Buscando tu compu…');
    const d = await SENAL.leer(codigo);
    if (!d || !d.offer) return estado('Este código ya no sirve. En la compu toca «Usar la cámara de mi teléfono» otra vez y escanea el nuevo código.', 'mal');
    if (d.answer) return estado('Este código ya lo usó otro teléfono. Pide un código nuevo en la compu.', 'mal');
    pc = new RTCPeerConnection({ iceServers:[{ urls:['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] });
    pc.ondatachannel = e => { dc = e.channel; dc.binaryType = 'arraybuffer'; dc.onopen = () => { estado('✓ Conectado con la compu. Ya puedes grabar desde el Estudio de video.', 'ok'); mandarInfo(); };
      dc.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (x) { return; }
        if (m.t === 'grabar') grabar();
        else if (m.t === 'pausa' && rec && rec.state === 'recording'){ rec.pause(); $('rec').classList.add('pausa'); }
        else if (m.t === 'seguir' && rec && rec.state === 'paused'){ rec.resume(); $('rec').classList.remove('pausa'); }
        else if (m.t === 'detener') detener();
        else if (m.t === 'cancelar' && rec && rec.state !== 'inactive'){ rec.onstop = null; rec.stop(); clearInterval(reloj); $('rec').hidden = true; $('bGirar').disabled = $('calidad').disabled = false; estado('Grabación cancelada desde la compu.'); }
      };
      dc.onclose = () => { if (rec && rec.state !== 'inactive') estado('Se perdió la conexión, pero sigues grabando aquí. Al terminar usa «Guardar en este teléfono».', 'mal'); else estado('La compu se desconectó. Puedes cerrar esta página.', 'mal'); };
    };
    sender = pc.addTrack(stream.getVideoTracks()[0], stream);
    await pc.setRemoteDescription({ type:'offer', sdp:d.offer });
    await pc.setLocalDescription(await pc.createAnswer());
    await esperarICE(pc, 2500);
    await SENAL.responder(codigo, pc.localDescription.sdp);
    estado('Conectando con la compu…');
    pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') estado('No se pudo conectar. Pon la compu y el teléfono en la misma red Wi-Fi y vuelve a escanear el código.', 'mal'); };
  }
  async function pantallaEncendida(){ try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pantallaEncendida(); });

  (async () => {
    if (!codigo) return estado('Abre esta página escaneando el código QR del Estudio de video en tu compu.', 'mal');
    if (!navigator.mediaDevices || !window.RTCPeerConnection) return estado('Este navegador no puede usar la cámara así. Usa Chrome (Android) o Safari (iPhone) actualizados.', 'mal');
    try { await abrirCamara(); }
    catch (e) { return estado('Necesito permiso para usar la cámara y el micrófono. Toca el candado de la barra de direcciones y permítelos.', 'mal'); }
    pantallaEncendida();
    try { await conectar(); } catch (e) { estado('No se pudo conectar: ' + e.message, 'mal'); }
  })();
})();
</script>
</body>
</html>
