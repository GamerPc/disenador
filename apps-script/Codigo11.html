function alternarCuadricula(){ cuadriculaWeb = !cuadriculaWeb; $('bCuadricula').classList.toggle('on', cuadriculaWeb); canvas.requestRenderAll(); }
canvas.on('after:render', () => {
  if (!cuadriculaWeb || generandoVista) return;
  const ctx = canvas.contextContainer, v = canvas.viewportTransform, movil = W <= 700;
  const n = movil ? 4 : 12, m = movil ? 16 * W / 390 : 80 * W / 1440, g = movil ? 16 * W / 390 : 24 * W / 1440;
  const col = (W - 2 * m - (n - 1) * g) / n;
  ctx.save(); ctx.transform(v[0], v[1], v[2], v[3], v[4], v[5]);
  ctx.fillStyle = 'rgba(255,75,43,.09)';
  for (let i = 0; i < n; i++) ctx.fillRect(m + i * (col + g), 0, col, H);
  ctx.strokeStyle = 'rgba(255,75,43,.35)'; ctx.lineWidth = 1 / zoom;
  ctx.beginPath(); ctx.moveTo(m, 0); ctx.lineTo(m, H); ctx.moveTo(W - m, 0); ctx.lineTo(W - m, H); ctx.stroke();
  ctx.restore();
});

function ponerEnlace(){
  const o = activo(); if (!o) return toast('Selecciona el botón o elemento que llevará a otra pantalla');
  const r = prompt('¿A dónde lleva al tocarlo en «Presentar»?\n• Escribe el número de página (1 a ' + paginas.length + ')\n• o una dirección web (https://…)\nDéjalo vacío para quitar el enlace.', o.enlace ? (o.enlace.startsWith('p:') ? o.enlace.slice(2) : o.enlace) : '');
  if (r === null) return;
  const v = r.trim();
  if (!v){ o.enlace = null; toast('Enlace quitado'); }
  else if (/^\d+$/.test(v)){ const n = +v; if (n < 1 || n > paginas.length) return toast('Ese número de página no existe'); o.enlace = 'p:' + n; toast('Al tocarlo en «Presentar» irá a la página ' + n); }
  else if (/^(https?:\/\/|mailto:|tel:)/i.test(v)){ o.enlace = v; toast('Al tocarlo en «Presentar» abrirá ' + v); }
  else return toast('Escribe un número de página o una dirección que empiece con https://');
  actualizarPanel(); guardarEstado();
}

function objetoConEnlace(e){
  if (!pres || !pres.cur) return null;
  const el = pres.cur.wrap.querySelector('canvas'); if (!el) return null;
  const r = el.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return null;
  const p = new fabric.Point(e.clientX - r.left, e.clientY - r.top);
