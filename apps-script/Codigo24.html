<script>
/*@parte Codigo24*/ (window.__partes = window.__partes || {})['Codigo24'] = true;

/* =========================================================
   CARTEL DE LOGROS CON FOTOS (rendición de cuentas de la escuela)
   Encabezado con logos, franja con escena escolar, título con píldora y seis recuadros
   de colores con pestaña, fotos (marcos donde se suelta la foto) y texto. Todo se puede editar.
   ========================================================= */
// achica la letra hasta que el texto quepa en sus renglones (sin que se parta una palabra a otro renglón)
function CABE(t){
  const n = t.text.split('\n').length;
  while (t.textLines.length > n && t.fontSize > 12){ t.set('fontSize', t.fontSize - 2); t.initDimensions(); }
  return t;
}
// texto de varios colores: partes = [[texto, color], ...]
function T_COLORES(partes, x, y, o = {}){
  const t = T(partes.map(p => p[0]).join(''), x, y, o);
  let i = 0;
  partes.forEach(([txt, col]) => { t.setSelectionStyles({ fill:col }, i, i + txt.length); i += txt.length; });
  t.name = o.nombre || 'Texto';
  return CABE(t);
}
// recuadro con pestaña de título, fotos y texto de abajo
function RECUADRO_LOGRO(x, y, w, h, titulo, borde, pestana, fotos, texto, o = {}){
  RECT(x, y, w, h, '#ffffff', { r:22, stroke:borde, sw:9, nombre:'Recuadro: ' + titulo });
  const tw = o.tw || w - 40, th = 74;
  RECT(x + (w - tw) / 2, y - th / 2 - 4, tw, th, pestana, { r:18, nombre:'Pestaña: ' + titulo });
  CABE(T(titulo, x + w / 2, y - 4, { f:'Oswald', s:o.ts || 54, b:'700', c:'#111111', w:tw - 10 })).name = 'Título: ' + titulo;
  fotos.forEach(([fx, fy, fw, fh]) => { FOTO(x + fx, y + fy, fw, fh, 'rect').name = 'Foto: ' + titulo; });
  CABE(T(texto, x + w / 2, o.yt, { f:'Oswald', s:o.s || 44, b:'700', c:'#111111', w:w - 40, lh:1.05 })).name = 'Texto: ' + titulo;
}
function ESCENA_ESCUELA(y0, alto){
  const N = n => ({ nombre:'Escena: ' + n });
  [[150, y0 + 70, 1], [610, y0 + 50, 0.8], [1180, y0 + 60, 1.1]].forEach(([cx, cy, k]) => {
    FIG(circD(cx, cy, 34 * k) + circD(cx + 40 * k, cy - 14 * k, 42 * k) + circD(cx + 84 * k, cy, 32 * k), '#ffffff', { op:0.95, ...N('Nube') });
  });
  FIG(`M0 ${y0 + alto - 120}Q350 ${y0 + alto - 190} 700 ${y0 + alto - 130}T1374 ${y0 + alto - 150}V${y0 + alto}H0Z`, '#6cc04a', N('Pasto'));
  FIG(`M0 ${y0 + alto - 70}Q500 ${y0 + alto - 120} 1000 ${y0 + alto - 80}T1374 ${y0 + alto - 90}V${y0 + alto}H0Z`, '#4fa83a', N('Pasto'));
  // árboles
  [[200, 0.85], [1160, 0.95]].forEach(([cx, k]) => {
    RECT(cx - 12 * k, y0 + alto - 170 * k, 24 * k, 110 * k, '#8b5a2b', { ...N('Tronco') });
    FIG(circD(cx, y0 + alto - 200 * k, 62 * k) + circD(cx - 45 * k, y0 + alto - 160 * k, 46 * k) + circD(cx + 45 * k, y0 + alto - 160 * k, 46 * k), '#2f9e44', N('Árbol'));
  });
  // escuela
  const ex = 687, eb = y0 + alto - 40, ew = 300, eh = 120;
  RECT(ex - ew / 2, eb - eh, ew, eh, '#fbbf24', { stroke:'#b45309', sw:4, ...N('Escuela') });
  FIG(`M${ex - ew / 2 - 25} ${eb - eh}L${ex} ${eb - eh - 70}L${ex + ew / 2 + 25} ${eb - eh}Z`, '#ef4444', N('Techo'));
  CIRC(ex, eb - eh - 30, 24, '#ffffff', { stroke:'#7f1d1d', sw:4, nombre:'Escena: Reloj' });
  N_P(`M${ex} ${eb - eh - 70}V${eb - eh - 110}`, { stroke:'#7f1d1d', sw:4, nombre:'Escena: Asta' });
  FIG(`M${ex} ${eb - eh - 110}h44l-10 13l10 13h-44Z`, '#ef4444', N('Bandera'));
  [[-120, -100], [-120, -50], [90, -100], [90, -50]].forEach(([dx, dy]) => RECT(ex + dx, eb + dy, 30, 36, '#7dd3fc', { stroke:'#b45309', sw:3, ...N('Ventana') }));
  RECT(ex - 34, eb - 64, 68, 64, '#38bdf8', { stroke:'#b45309', sw:4, ...N('Puerta') });
  T('ESCUELA', ex, eb - eh + 22, { f:'Oswald', s:24, b:'700', c:'#7c2d12', w:200 }).name = 'Escena: Letrero';
}
function crearCartelLogros(){
  FONDO('#ffffff');
  // encabezado: tres lugares para logos y el texto del programa a la derecha
  FOTO(36, 10, 320, 96, 'rect').name = 'Logo 1';
  N_P('M380 24V96', { stroke:'#c5c1b5', sw:3, nombre:'Divisor' });
  FOTO(400, 10, 330, 96, 'rect').name = 'Logo 2';
  N_P('M752 24V96', { stroke:'#c5c1b5', sw:3, nombre:'Divisor' });
  FOTO(772, 10, 140, 96, 'rect').name = 'Logo 3';
  T('Programa La Escuela es Nuestra\n(LEEN)\nRecurso 2026', 1100, 58, { f:'Oswald', s:30, b:'700', c:'#111111', w:420, al:'right', lh:1.05 }).name = 'Programa';
  // franja con escena
  RECT(0, 116, 1374, 344, '#b1edf5', { nombre:'Franja del encabezado' });
  ESCENA_ESCUELA(116, 344);
  T_COLORES([['¡LA ESCUELA ', '#c8202a'], ['ES NUESTRA ', '#13315c'], ['- LEEN', '#6e1f3b']], 690, 162, { f:'Oswald', s:70, b:'700', w:1300, nombre:'Título del programa' });
  T('Ciclo Escolar / Recurso 2026', 702, 442, { f:'Oswald', s:30, b:'400', c:'#1f2937', w:420 }).name = 'Ciclo escolar';
  // título
  CABE(T('Logros y Mejoras en Nuestra', 548, 518, { f:'Oswald', s:84, b:'700', c:'#111111', w:790, al:'right' })).name = 'Título';
  RECT(966, 476, 356, 84, '#a8835a', { r:42, nombre:'Píldora' });
  T_COLORES([['Recurso ', '#2b1d10'], ['2026', '#ffffff']], 1144, 518, { f:'Oswald', s:56, b:'700', w:310, nombre:'Texto de la píldora' });
  // columna izquierda
  RECUADRO_LOGRO(74, 600, 600, 430, 'Mantenimiento y Limpieza', '#1d81b3', '#cff4fd',
    [[24, 140], [170, 110], [286, 160], [452, 124]].flatMap(([cx, cw]) => [[cx, 50, cw - 4, 100], [cx, 154, cw - 4, 122]]), 'Se compró material de\nmantenimiento, limpieza y\ndidáctico', { yt:958, tw:560, s:40 });
  RECUADRO_LOGRO(74, 1080, 600, 440, 'Juegos Infantiles', '#dfaa1c', '#ffe38f',
    [[22, 46, 272, 122], [22, 176, 272, 140], [302, 46, 276, 270]], 'Se realizaron juegos\nrecreativos para los niños', { yt:1440, tw:440 });
  RECUADRO_LOGRO(74, 1580, 600, 430, 'Mejora de Aulas', '#bf1a20', '#ffb0ac',
    [[20, 46, 274, 264], [304, 46, 278, 264]], 'Se arregló el piso para los salones\nde 1°, 2°, 3° y la biblioteca', { yt:1946, tw:430, s:42 });
  // columna derecha
  RECUADRO_LOGRO(710, 610, 600, 460, 'Área para Comer', '#2e9426', '#b5e486',
    [[22, 44, 304, 294], [334, 44, 246, 294]], 'Rehabilitación del área\npara comer', { yt:1000, tw:440 });
  RECUADRO_LOGRO(710, 1136, 600, 464, 'Mobiliario Escolar', '#248bb8', '#a1d9ea',
    [[22, 44, 282, 286], [312, 44, 268, 286]], 'Se compraron muebles\npara los salones', { yt:1528, tw:490 });
  RECT(710, 1630, 600, 380, '#ffffff', { r:22, stroke:'#70203b', sw:9, nombre:'Recuadro final' });
  CABE(T('...¡Y muchas cosas más\npara el bienestar de\nnuestros niños!', 1010, 1810, { f:'Oswald', s:60, b:'700', c:'#111111', w:560, lh:1.12 })).name = 'Mensaje final';
  FOTO(1236, 1922, 128, 84, 'rect').name = 'Logo pequeño';
  // pie
  RECT(0, 2016, 1374, 32, '#b89055', { nombre:'Barra del pie' });
  T('Fecha del Recurso: Año 2026', 687, 2032, { f:'Montserrat', s:24, b:'700', c:'#ffffff', w:800 }).name = 'Fecha';
}
CATALOGO.push({ nombre:'Logros de la escuela con fotos', cat:CAT_CART, tam:[1374, 2048], crear:crearCartelLogros,
  usar:() => usarPlantillaCC({ nombre:'Logros de la escuela con fotos', tam:[1374, 2048], crear:crearCartelLogros }) });
if (!FUENTES_CC.includes('Oswald')) FUENTES_CC.push('Oswald');
/* =========================================================
   BÚSQUEDA RÁPIDA DE HERRAMIENTAS Y ACCIONES
   ========================================================= */
const ALIAS_HERRAMIENTAS = {
  tPlantillas:'diseños tareas portadas carteles publicaciones redes presentaciones',
  tTexto:'escribir título subtítulo letras tipografía fuente',
  tFormas:'cuadros círculos líneas flechas figuras',
  tElementos:'iconos íconos stickers qr código barras adornos',
  tDibujar:'pluma dibujo a mano trazo firma',
  tImagenes:'fotos imágenes quitar fondo recortar banco fotos libres',
  tDiagramas:'mapa mental mapas mentales conceptos organigrama flujo cronología',
  tFondo:'colores textura color fondo página',
  tMarca:'logo marca colores identidad visual',
  tWeb:'página sitio web app aplicación celular sistema interfaz'
};
const normalizarBusquedaHerramienta = texto => sinAcentos(String(texto || '')).replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
const PUENTE_BUSQUEDA_HERRAMIENTA = new Set(['de','del','para','con','por','el','la','las','los','y','un','una','mi','en','hacer','haz','crear','crea','diseñar','diseña','quiero','necesito']);
let focoAntesBuscarHerramienta = null;

function listarHerramientasBuscables(){
  const items = [...document.querySelectorAll('#pestanas button[data-tab]')].map(b => {
    const panel = $(b.dataset.tab); if (!panel) return null;
    const detalle = [...panel.querySelectorAll('h4,button')].map(x => (x.textContent || x.title || '').replace(/\s+/g, ' ').trim()).filter(Boolean);
    return { tipo:'panel', id:b.dataset.tab, titulo:(b.getAttribute('aria-label') || b.textContent).replace(/\s+/g, ' ').trim(),
      detalle, buscar:normalizarBusquedaHerramienta([b.title, b.getAttribute('aria-label'), panel.textContent, ALIAS_HERRAMIENTAS[b.dataset.tab] || ''].join(' ')), boton:b };
  }).filter(Boolean);
  const agregar = (titulo, detalle, buscar, ejecutar) => items.push({ tipo:'acción', titulo, detalle, buscar:normalizarBusquedaHerramienta(titulo + ' ' + detalle + ' ' + buscar), ejecutar });
  agregar('Exportar o descargar', 'PNG, JPG, PDF, PowerPoint y video MP4', 'guardar imprimir bajar archivo', () => abrirModal('mExportar'));
  agregar('Quitar fondo de una foto', 'Abre la herramienta para borrar el fondo de una imagen', 'quitar fondo fotos imagen transparente recortar', () => { const boton = document.querySelector('#pestanas [data-tab="tImagenes"]'); if (boton) boton.click(); });
  agregar('Presentar o proyectar', 'Muestra tus diapositivas en pantalla completa', 'exposición exposición diapositivas clase', () => abrirModal('mPresentar'));
  agregar('Buscar texto en el diseño', 'Encuentra y reemplaza palabras', 'buscar reemplazar texto', () => abrirBuscar());
  if (typeof abrirEscuela === 'function') agregar('Modo escuela', 'Grupos, tareas, actividades y entregas', 'maestro alumno clase escolar', () => abrirEscuela());
  if (typeof irAlEstudioEV === 'function') agregar('Estudio de video', 'Graba, edita y prepara videos', 'cámara grabar música reels mp4', () => irAlEstudioEV());
  return items;
}

function cerrarBuscarHerramienta(devolverFoco = true){
  cerrarModal('mHerramientas');
  const foco = focoAntesBuscarHerramienta; focoAntesBuscarHerramienta = null;
  if (devolverFoco && foco && foco.isConnected && foco.focus) foco.focus();
}
function abrirBuscarHerramienta(consulta = ''){
  focoAntesBuscarHerramienta = document.activeElement;
  abrirModal('mHerramientas');
  const input = $('buscarHerramienta'); input.value = consulta; pintarResultadosHerramientas();
  requestAnimationFrame(() => input.focus());
}
function ejecutarHerramientaBuscada(item){
  cerrarBuscarHerramienta(false);
  if (item.ejecutar){ item.ejecutar(); return; }
  const app = $('app');
  if (item.boton.classList.contains('activa')){
    if (window.innerWidth <= 820 && typeof abrirLateral === 'function') abrirLateral(true);
    else if (app.classList.contains('sinLateral') && typeof ponerLateral === 'function') ponerLateral(true);
    return;
  }
  item.boton.click();
}
function pintarResultadosHerramientas(){
  const consulta = normalizarBusquedaHerramienta($('buscarHerramienta').value);
  const palabras = consulta.split(' ').filter(p => p && !PUENTE_BUSQUEDA_HERRAMIENTA.has(p));
  const items = listarHerramientasBuscables().filter(x => !palabras.length || palabras.every(p => x.buscar.includes(p)))
    .map((item, orden) => ({ item, orden, titulo:normalizarBusquedaHerramienta(item.titulo) }))
    .sort((a, b) => {
      const puntaje = x => palabras.reduce((n, p) => n + (x.titulo.includes(p) ? 2 : 0), 0);
      return puntaje(b) - puntaje(a) || a.orden - b.orden;
    }).map(x => x.item);
  const lista = $('resultadoHerramientas'); lista.replaceChildren();
  const visibles = items.slice(0, consulta ? 8 : 6);
  if (!visibles.length){ const p = document.createElement('p'); p.className = 'hint'; p.textContent = 'No encontramos esa herramienta. Prueba con “foto”, “mapa”, “video” o “descargar”.'; lista.appendChild(p); return; }
  visibles.forEach(item => {
    const relevantes = Array.isArray(item.detalle) ? item.detalle.filter(t => palabras.some(p => normalizarBusquedaHerramienta(t).includes(p))).slice(0, 2) : [];
    const b = document.createElement('button'); b.type = 'button'; b.className = 'bigbtn toolResultado';
    const nombre = document.createElement('span'); nombre.textContent = item.titulo; b.appendChild(nombre);
    const detalle = document.createElement('small');
    detalle.textContent = Array.isArray(item.detalle)
      ? relevantes.join(' · ') || item.detalle.slice(0, 3).join(' · ') || 'Abre esta herramienta'
      : item.detalle || 'Abre esta herramienta';
    b.appendChild(detalle); b.setAttribute('aria-label', item.titulo + (detalle.textContent ? ': ' + detalle.textContent : ''));
    b.onclick = () => ejecutarHerramientaBuscada(item); lista.appendChild(b);
  });
}
$('buscarHerramienta').addEventListener('input', pintarResultadosHerramientas);
$('bBuscarHerramienta').onclick = () => abrirBuscarHerramienta();
$('mHerramientas').addEventListener('click', e => { if (e.target === $('mHerramientas')) cerrarBuscarHerramienta(); });
document.addEventListener('keydown', e => {
  if (!$('mHerramientas').classList.contains('abierto')) return;
  if (e.key === 'Escape'){ e.preventDefault(); cerrarBuscarHerramienta(); }
  else if (e.key === 'Tab'){
    const focables = [...$('mHerramientas').querySelectorAll('input:not([disabled]),button:not([disabled])')].filter(x => !x.closest('[hidden]'));
    if (!focables.length) return;
    const primero = focables[0], ultimo = focables[focables.length - 1];
    if (e.shiftKey && (e.target === primero || !focables.includes(e.target))){ e.preventDefault(); ultimo.focus(); }
    else if (!e.shiftKey && e.target === ultimo){ e.preventDefault(); primero.focus(); }
  }
  else if (e.key === 'ArrowDown' && e.target === $('buscarHerramienta')){
    const primero = $('resultadoHerramientas').querySelector('button'); if (primero){ e.preventDefault(); primero.focus(); }
  } else if (e.key === 'Enter' && e.target === $('buscarHerramienta')){
    const primero = $('resultadoHerramientas').querySelector('button'); if (primero){ e.preventDefault(); primero.click(); }
  }
}, true);
/* =========================================================
   PANTALLA DE INICIO: «¿Qué quieres crear hoy?»
   Aparece al abrir la app sin diseño y al empezar uno nuevo. Busca plantillas escribiendo o
   dictando con la voz, elige un tamaño mirando su forma real y llega a lo más usado en un toque.
   ========================================================= */
const INICIO_IDEAS = ['Tarea', 'Mapa mental', 'Cartel escolar', 'Línea del tiempo', 'Presentación', 'Portada', 'Menú', 'Lona', 'Sublimación'];
// [título, detalle, ancho, alto, cm (medida real) o null]
const INICIO_FORMATOS = [
  ['Publicación', 'Cuadrada 1080 × 1080', 1080, 1080, null],
  ['Historia o reel', 'Vertical 1080 × 1920', 1080, 1920, null],
  ['Presentación', 'Horizontal 16:9', 1920, 1080, null],
  ['Hoja carta', 'Tareas e impresos', 21.59, 27.94, 'impresion'],
  ['Lona 2 × 1 m', 'Lista para imprenta', 200, 100, 'lona'],
  ['Taza 11 oz', 'Sublimación', 20, 9.5, 'sublimacion']
];
const INICIO_ATAJOS = [
  ['📂', 'Abrir un diseño', 'Los que guardaste o un archivo', () => { abrirModal('mProyectos'); if (typeof listar === 'function') listar(); }],
  ['🎓', 'Mi escuela', 'Grupos, tareas y entregas', () => typeof abrirEscuela === 'function' ? abrirEscuela() : abrirInicioPestana('tPlantillas')],
  ['🧠', 'Mapa mental', 'Ideas conectadas en minutos', () => abrirInicioPestana('tDiagramas')],
  ['🪄', 'Quitar fondo', 'De una foto, con un toque', () => abrirInicioPestana('tImagenes')],
  ['🔳', 'Código QR', 'Para carteles e invitaciones', () => abrirInicioPestana('tElementos')],
  ['🎬', 'Video', 'Reels y videos con tu diseño', () => { if (typeof irAlEstudioEV === 'function') irAlEstudioEV(); }]
];
function abrirInicioPestana(id){
  const b = document.querySelector(`#pestanas button[data-tab="${id}"]`);
  if (!b) return;
  if (!b.classList.contains('activa') || !$('lateral').classList.contains('abierto')) b.click();
}
function inicioSilueta(w, h){
  const k = 46 / Math.max(w, h);
  return `<span class="inSil" aria-hidden="true"><i style="width:${Math.max(10, Math.round(w * k))}px;height:${Math.max(10, Math.round(h * k))}px"></i></span>`;
}
(function(){
  const d = document.createElement('div'); d.id = 'inicioApp'; d.hidden = true;
  d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-labelledby', 'inTitulo');
  const voz = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  d.innerHTML = `<div class="inCaja">
    <button class="inCerrar" id="inCerrar" aria-label="Cerrar e ir al lienzo" title="Ir al lienzo">✕</button>
    <section class="inHeroe">
      <h2 id="inTitulo">¿Qué quieres crear hoy?</h2>
      <p>Escribe ${voz ? 'o dicta ' : ''}lo que necesitas y te mostramos diseños listos para cambiar a tu gusto.</p>
      <form class="inBusca" id="inForm" role="search">
        <input id="inTexto" type="search" placeholder="Ej.: tarea de ciencias, línea del tiempo, menú…" aria-label="¿Qué quieres crear?" autocomplete="off" enterkeyhint="search">
        ${voz ? '<button type="button" class="inVoz" id="inVoz" aria-label="Dictar con la voz" title="Dictar con la voz">🎙</button>' : ''}
        <button type="submit" class="inIr">Buscar</button>
      </form>
      <div class="inIdeas" aria-label="Ideas">${INICIO_IDEAS.map(t => `<button type="button" data-idea="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    </section>
    <section aria-labelledby="inTitTam">
      <h3 id="inTitTam">O empieza en blanco con un tamaño</h3>
      <div class="inFormatos">${INICIO_FORMATOS.map(([t, s, w, h], i) => `<button type="button" class="inFormato" data-fmt="${i}">${inicioSilueta(w, h)}<b>${esc(t)}</b><small>${esc(s)}</small></button>`).join('')}
        <button type="button" class="inFormato" id="inOtro"><span class="inSil" aria-hidden="true"><i class="otro">⋯</i></span><b>Otro tamaño</b><small>Redes, lonas, playeras…</small></button></div>
    </section>
    <section aria-labelledby="inTitAt">
      <h3 id="inTitAt">Lo más usado</h3>
      <div class="inAtajos">${INICIO_ATAJOS.map(([ico, t, s], i) => `<button type="button" data-at="${i}"><span class="inIco" aria-hidden="true">${ico}</span><span><b>${esc(t)}</b><small>${esc(s)}</small></span></button>`).join('')}</div>
    </section>
    <footer class="inPie">
      <button type="button" class="inLink" id="inPasos">🚀 ¿Primera vez? Te guío paso a paso</button>
      <button type="button" class="inLink" id="inLetras" aria-pressed="false">Aa Letras grandes</button>
      <button type="button" class="inBlanco" id="inBlanco">Ir al lienzo →</button>
    </footer>
  </div>`;
  document.body.appendChild(d);
  const texto = $('inTexto');
  const buscar = q => {
    q = String(q || '').trim(); cerrarInicio();
    abrirInicioPestana('tPlantillas');
    const todas = [...document.querySelectorAll('#chipsCat .chip')].find(c => /todas/i.test(c.textContent));
    if (todas && !todas.classList.contains('on')) todas.click();
    $('buscarPlantilla').value = q; renderCatalogo();
    // que se vean los resultados, no la lista de categorías
    setTimeout(() => { const c = $('catalogo'); if (c && c.firstElementChild) c.scrollIntoView({ block:'start', behavior:'smooth' }); }, 80);
  };
  $('inForm').onsubmit = e => { e.preventDefault(); buscar(texto.value); };
  d.querySelectorAll('[data-idea]').forEach(b => b.onclick = () => buscar(b.dataset.idea));
  d.querySelectorAll('[data-fmt]').forEach(b => b.onclick = () => {
    const [t, , w, h, tipo] = INICIO_FORMATOS[+b.dataset.fmt];
    cerrarInicio();
    if (tipo) aplicarTamanoFisico(w, h, tipo === 'sublimacion' ? 'impresion' : tipo);
    else { aplicarTamano(w, h); medidaReal = null; if (typeof pintarMedida === 'function') pintarMedida(); toast('Listo: ' + t + ' de ' + w + ' × ' + h); }
    abrirInicioPestana('tTexto');
  });
  $('inOtro').onclick = () => { cerrarInicio(); abrirModal('mTamano'); };
  d.querySelectorAll('[data-at]').forEach(b => b.onclick = () => { cerrarInicio(); INICIO_ATAJOS[+b.dataset.at][3](); });
  $('inPasos').onclick = () => { cerrarInicio(); iniciarPrimerosPasos(true); };
  $('inLetras').onclick = () => { const on = !document.documentElement.classList.contains('letraGrande'); ponerLetrasGrandes(on); $('inLetras').setAttribute('aria-pressed', on ? 'true' : 'false'); };
  $('inBlanco').onclick = $('inCerrar').onclick = () => cerrarInicio();
  d.addEventListener('click', e => { if (e.target === d) cerrarInicio(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !d.hidden){ e.preventDefault(); e.stopPropagation(); cerrarInicio(); } }, true);
  d.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;          // el foco se queda dentro de la ventana
    const bs = [...d.querySelectorAll('button,input')].filter(x => x.offsetParent);
    const i = bs.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0){ e.preventDefault(); bs[bs.length - 1].focus(); }
    else if (!e.shiftKey && i === bs.length - 1){ e.preventDefault(); bs[0].focus(); }
  });
  // dictado con la voz (Chrome, Edge, Safari y la mayoría de celulares)
  if (voz){
    let rec = null;
    $('inVoz').onclick = () => {
      if (rec){ rec.stop(); return; }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      rec = new SR(); rec.lang = 'es-MX'; rec.interimResults = true; rec.maxAlternatives = 1;
      const b = $('inVoz'); b.classList.add('oyendo'); b.setAttribute('aria-label', 'Escuchando… toca para terminar');
      texto.placeholder = 'Te escucho… di qué quieres crear';
      let final = '';
      rec.onresult = e => { final = [...e.results].map(r => r[0].transcript).join(' '); texto.value = final; };
      rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('Permite el micrófono para dictar, o escribe lo que necesitas'); };
      rec.onend = () => {
        rec = null; b.classList.remove('oyendo'); b.setAttribute('aria-label', 'Dictar con la voz');
        texto.placeholder = 'Ej.: tarea de ciencias, línea del tiempo, menú…';
        if (final.trim()) buscar(final.replace(/[.¿?¡!]+$/g, ''));
      };
      try { rec.start(); } catch (e) { rec = null; b.classList.remove('oyendo'); }
    };
  }
  // «Inicio» en el menú Archivo y al tocar el logo
  const bi = document.createElement('button'); bi.className = 'tb'; bi.id = 'bInicio'; bi.type = 'button';
  bi.textContent = '🏠 Inicio'; bi.title = 'Ver la pantalla de inicio';
  bi.onclick = () => abrirInicio();
  const mp = $('maPrincipal'); if (mp) mp.prepend(bi);
  const logo = document.querySelector('#barra .logo');
  if (logo){ logo.style.cursor = 'pointer'; logo.title = 'Inicio'; logo.addEventListener('click', () => abrirInicio()); }
})();
function esTelInicio(){ return matchMedia('(max-width: 820px)').matches; }
let focoAntesInicio = null;
function abrirInicio(){
  const d = $('inicioApp'); if (!d || !d.hidden) return;
  focoAntesInicio = document.activeElement;
  document.querySelectorAll('.modal.abierto').forEach(m => m.classList.remove('abierto'));
  if (typeof cerrarMenuArchivo === 'function') cerrarMenuArchivo();
  $('inTexto').value = '';
  $('inLetras').setAttribute('aria-pressed', document.documentElement.classList.contains('letraGrande') ? 'true' : 'false');
  d.hidden = false; document.body.classList.add('conInicio', 'inicioVisto');
  if (!esTelInicio()) setTimeout(() => $('inTexto').focus(), 30); else setTimeout(() => $('inCerrar').focus({ preventScroll:true }), 30);
}
function cerrarInicio(){
  const d = $('inicioApp'); if (!d || d.hidden) return;
  d.hidden = true; document.body.classList.remove('conInicio');
  try { localStorage.setItem('disenador_recorrido', '1'); } catch (e) {}   // ya no hace falta el aviso de «¿Primera vez aquí?»
  if (focoAntesInicio && focoAntesInicio.focus && document.contains(focoAntesInicio)) focoAntesInicio.focus({ preventScroll:true });
}
// al empezar un diseño nuevo, se ofrece elegir qué crear
{ const antes = nuevoDiseno; nuevoDiseno = function(){ const r = antes.apply(this, arguments); if (!canvas.getObjects().length && paginas.length <= 1) abrirInicio(); return r; }; }
// al abrir la app sin diseño (ni enlace a otro diseño, equipo o grupo)
setTimeout(() => {
  if (location.search.length > 1) return;   // llegó por un enlace (diseño compartido, equipo, grupo, aviso…)
  if (document.querySelector('.modal.abierto') || ($('presentacion') && $('presentacion').classList.contains('abierta'))) return;
  if (!canvas.getObjects().length && paginas.length <= 1) abrirInicio();
}, 1200);
/* =========================================================
   MODO SENCILLO Y MODO COMPLETO (para todas las edades)
   Sencillo: solo lo básico, botones con su nombre escrito, palabras fáciles y una ayudita que
   dice qué hacer en cada momento. Completo: todas las herramientas, como siempre.
   ========================================================= */
function modoSencillo(){ return document.documentElement.classList.contains('sencillo'); }
// el modo se elige una vez; quien ya usaba la app sigue en el completo, quien llega nuevo empieza en el sencillo
function modoGuardado(){
  try {
    const m = localStorage.getItem('disenador_modo'); if (m === 'sencillo' || m === 'completo') return m;
    return localStorage.getItem('disenador_borrador') || localStorage.getItem('disenador_recorrido') === '1' ? 'completo' : 'sencillo';
  } catch (e) { return 'completo'; }
}
// palabras más fáciles en el modo sencillo: [qué buscar, texto normal, texto sencillo]
const PALABRAS_SENCILLAS = [
  ['#tabFormas', 'Formas', 'Figuras'], ['#tabImagenes', 'Imágenes', 'Fotos'], ['#tabElementos', 'Íconos', 'Stickers'],
  ['#barra button[onclick*="mExportar"]', 'Exportar', 'Descargar']
];
// nombres que se ven debajo de los botones que solo tienen dibujito
const ETIQUETAS_BR = { fuente:'Letra', color:'Color', bNegrita:'Negrita', bCursiva:'Cursiva', alinear:'Alinear', voltear:'Voltear', todo:'Más', borde:'Borde' };
function ponerModo(m, avisar = true){
  const s = m === 'sencillo';
  document.documentElement.classList.toggle('sencillo', s);
  try { localStorage.setItem('disenador_modo', s ? 'sencillo' : 'completo'); } catch (e) {}
  PALABRAS_SENCILLAS.forEach(([sel, normal, facil]) => {
    const b = document.querySelector(sel); if (!b) return;
    const nodo = [...b.childNodes].reverse().find(n => n.nodeType === 3 && n.textContent.trim());
    if (nodo) nodo.textContent = nodo.textContent.replace(s ? normal : facil, s ? facil : normal);
  });
  const b = $('bModo');
  if (b){ b.innerHTML = s ? '😊<span> Sencillo</span>' : '🎨<span> Completo</span>'; b.title = s ? 'Estás en el modo sencillo. Toca para ver todas las herramientas' : 'Estás en el modo completo. Toca para usar el modo sencillo'; b.setAttribute('aria-pressed', s ? 'true' : 'false'); b.setAttribute('aria-label', b.title); }
  document.querySelectorAll('[data-modo]').forEach(x => x.setAttribute('aria-pressed', x.dataset.modo === (s ? 'sencillo' : 'completo') ? 'true' : 'false'));
  if (s){                                     // en sencillo no se ven las herramientas escondidas: si estabas en una, vuelves a Plantillas
    const act = document.querySelector('#pestanas button.activa');
    if (act && getComputedStyle(act).display === 'none') $('tabPlantillas').click();
  }
  if (typeof construirBarraRapida === 'function' && activo()) construirBarraRapida();
  dispatchEvent(new Event('resize'));
  pintarAyudaS();
  if (avisar) toast(s ? '😊 Modo sencillo: solo lo básico y con ayuda. Puedes volver al completo cuando quieras.' : '🎨 Modo completo: todas las herramientas a la vista.');
}
(function(){
  // botón en la barra de arriba (en la compu) y en el menú Archivo
  const b = document.createElement('button'); b.className = 'tb'; b.id = 'bModo'; b.type = 'button';
  b.onclick = () => ponerModo(modoSencillo() ? 'completo' : 'sencillo');
  const nombre = $('nombreDiseno'); if (nombre) nombre.after(b);
  const vista = $('maVista');
  if (vista){ ['sencillo', 'completo'].forEach(m => { const x = document.createElement('button'); x.className = 'tb'; x.type = 'button'; x.dataset.modo = m;
    x.textContent = m === 'sencillo' ? '😊 Modo sencillo (lo básico, con ayuda)' : '🎨 Modo completo (todas las herramientas)'; x.onclick = () => ponerModo(m); vista.prepend(x); }); }
  // nombres escritos en Deshacer / Rehacer y en la barra que aparece al seleccionar
  [['bDeshacer', 'Deshacer'], ['bRehacer', 'Rehacer']].forEach(([id, t]) => { const x = $(id); if (x){ const s = document.createElement('span'); s.className = 'etqS'; s.textContent = t; x.appendChild(s); } });
  const sel = $('barraSel');
  if (sel) sel.querySelectorAll('button[data-acc]').forEach(x => { const s = document.createElement('span'); s.className = 'etqS'; s.textContent = { duplicar:'Copiar', bloquear:'Fijar', eliminar:'Borrar', mas:'Más' }[x.dataset.acc] || ''; x.appendChild(s); });
  // la barra rápida se arma de nuevo con cada selección: se le ponen sus nombres cada vez
  const br = $('barraRapida');
  if (br) new MutationObserver(() => {
    br.querySelectorAll('button[data-k]').forEach(x => { const t = ETIQUETAS_BR[x.dataset.k]; if (t && !x.querySelector('.etqS')){ const s = document.createElement('span'); s.className = 'etqS'; s.textContent = t; x.appendChild(s); } });
    const tam = br.querySelector('.tamBR'); if (tam && !tam.querySelector('.etqS')){ const s = document.createElement('span'); s.className = 'etqS'; s.textContent = 'Tamaño'; tam.appendChild(s); }
  }).observe(br, { childList:true });
  // elegir el modo desde la pantalla de inicio
  const pie = document.querySelector('#inicioApp .inHeroe');
  if (pie){
    const d = document.createElement('div'); d.className = 'inModo'; d.setAttribute('role', 'group'); d.setAttribute('aria-label', '¿Cómo quieres usar el Diseñador?');
    d.innerHTML = `<span>¿Cómo lo quieres ver?</span>
      <button type="button" data-modo="sencillo"><b>😊 Sencillo</b><small>Lo básico, botones grandes y ayuda paso a paso</small></button>
      <button type="button" data-modo="completo"><b>🎨 Completo</b><small>Todas las herramientas, para quien ya diseña</small></button>`;
    d.querySelectorAll('[data-modo]').forEach(x => x.onclick = () => ponerModo(x.dataset.modo));
    pie.appendChild(d);
  }
  // la ayudita de abajo
  const a = document.createElement('div'); a.id = 'ayudaS'; a.setAttribute('role', 'status'); a.setAttribute('aria-live', 'polite');
  a.innerHTML = '<span id="ayudaSTexto"></span><button type="button" id="ayudaSCerrar" aria-label="Ocultar la ayuda" title="Ocultar la ayuda">✕</button>';
  const pieN = $('barraNotas'); if (pieN) pieN.prepend(a); else ($('centro') || document.body).appendChild(a);   // abajo, donde no tapa el diseño
  $('ayudaSCerrar').onclick = () => { try { localStorage.setItem('disenador_ayudaS', 'no'); } catch (e) {} pintarAyudaS(); toast('Ayuda oculta. Vuelve a verla en Archivo → «Mostrar la ayuda de cada paso».'); };
  if (vista){ const x = document.createElement('button'); x.className = 'tb'; x.type = 'button'; x.id = 'bAyudaS'; x.textContent = '💡 Mostrar la ayuda de cada paso';
    x.onclick = () => { try { localStorage.removeItem('disenador_ayudaS'); } catch (e) {} pintarAyudaS(); }; vista.appendChild(x); }
  ['selection:created', 'selection:updated', 'selection:cleared', 'text:editing:entered', 'text:editing:exited', 'object:added', 'object:removed', 'path:created', 'mouse:up']
    .forEach(ev => canvas.on(ev, () => setTimeout(pintarAyudaS, 0)));
  ponerModo(modoGuardado(), false);
})();
function textoAyudaS(){
  const o = activo(), tel = matchMedia('(max-width: 820px)').matches;
  if (canvas.isDrawingMode) return '🖍 Dibuja con el dedo o con el ratón. Cuando acabes, toca otra herramienta de la izquierda.';
  if (o && o.isEditing) return '⌨️ Escribe tu texto. Cuando termines, toca afuera, en cualquier parte vacía.';
  if (o){
    if (o.type === 'activeSelection') return '👥 Elegiste varias cosas: muévelas juntas o toca «Agrupar» para que no se separen.';
    if (/text/.test(o.type)) return tel ? '✏️ Toca dos veces el texto para escribir. Con «Editar» cambias la letra y el color.' : '✏️ Toca dos veces el texto para escribir. Arrástralo para moverlo y jala una esquina para hacerlo más grande.';
    if (o.type === 'image') return '🖼 Arrastra la foto para moverla y jala una esquina para cambiar su tamaño. Arriba puedes recortarla o quitarle el fondo.';
    return '🎨 Arrastra para moverlo y jala una esquina para cambiar su tamaño. Arriba cambias el color.';
  }
  if (!canvas.getObjects().length) return tel ? '👇 Para empezar, toca «Plantillas» abajo para elegir un diseño, o «Texto» para escribir.' : '👈 Para empezar, elige una plantilla o toca «Texto» para escribir algo.';
  return '👆 Toca cualquier cosa de tu diseño para cambiarla. ¿Te equivocaste? Toca «Deshacer». Cuando termines, toca «Descargar».';
}
function pintarAyudaS(){
  const a = $('ayudaS'); if (!a) return;
  let oculta = false; try { oculta = localStorage.getItem('disenador_ayudaS') === 'no'; } catch (e) {}
  const ver = modoSencillo() && !oculta && !document.documentElement.classList.contains('enfoque');
  a.hidden = !ver; const b = $('bAyudaS'); if (b) b.hidden = !modoSencillo() || !oculta;
  if (!ver) return;
  const t = textoAyudaS(); if ($('ayudaSTexto').textContent !== t) $('ayudaSTexto').textContent = t;
}
