function prMesNombre(){ return prMes.toLocaleDateString('es-MX', {month:'long', year:'numeric'}); }

    const b=document.createElement('button'); b.type='button'; b.className='prDia'+(fecha===hoy?' prHoy':'')+(fecha===prFechaSeleccionada?' prSeleccionado':'')+(cuantos?' prConItems':''); b.setAttribute('aria-label',`${d} de ${prMesNombre()}${cuantos ? `, ${cuantos} publicaciones. Toca para verlas` : '. Toca para crear una publicación'}`); b.setAttribute('aria-pressed',String(fecha===prFechaSeleccionada)); b.innerHTML=`<span>${d}</span>${cuantos?`<small>${cuantos} ${cuantos===1?'publicación':'publicaciones'}</small>`:''}`; b.onclick=()=>{if(cuantos){prFechaSeleccionada=fecha;prPintar();$('prLista').scrollIntoView({block:'nearest',behavior:'smooth'});}else prNueva(fecha);}; fragmento.appendChild(b);

    const estadoBtn=(texto,estadoNuevo,clase='btnS')=>{const b=document.createElement('button');b.type='button';b.className=clase;b.textContent=texto;b.onclick=()=>prCambiarEstado(p.id,estadoNuevo);return b;};
    if(['Idea','Borrador','Cambios solicitados'].includes(estadoActual)) acciones.append(estadoBtn('Enviar a revisión','En revisión'));
    if(estadoActual==='En revisión') acciones.append(estadoBtn('Aprobar','Aprobado','btnP'),estadoBtn('Pedir cambios','Cambios solicitados'));

    acciones.append(editar,copiar,disenar,borrar); card.appendChild(acciones); cont.appendChild(card);
  });
}
function prEstadoNormal(estado){ return estado==='Listo'?'Aprobado':(['Idea','Borrador','En diseño','En revisión','Cambios solicitados','Aprobado','Programado','Publicado'].includes(estado)?estado:'Idea'); }
function prCambiarEstado(id,estado){ const p=prPlanes.find(x=>x.id===id); if(!p)return; const anterior=p.estado; p.estado=estado; p.actualizado=new Date().toISOString(); if(!prGuardar()){p.estado=anterior;return;} prPintar(); toast('Estado actualizado: '+estado); }
function prEliminar(id){

  if (!prGuardar()){ prPlanes=anterior; return; }

async function prDisenar(id){
  const p=prPlanes.find(x=>x.id===id); if (!p) return;
  if (['Idea','Borrador','Cambios solicitados'].includes(prEstadoNormal(p.estado))){ p.estado='En diseño'; p.actualizado=new Date().toISOString(); if (!prGuardar()) return; }

  if (tieneTexto) await prCopiarTexto(p);
  cerrarModal('mPlanRedes');

  const chip=[...document.querySelectorAll('#chipsCat button')].find(b=>b.textContent.includes('Negocio y redes'));

function prTextoCompleto(p){ return [p.texto,p.cta,p.tags].filter(Boolean).join('\n\n'); }
async function prCopiarTexto(p){
  p=p || {texto:$('prTexto').value,cta:$('prCTA').value,tags:$('prTags').value}; const texto=prTextoCompleto(p); if (!texto) return toast('Agrega el texto, la llamada a la acción o los hashtags primero');

function prCSV(valor){ const t=String(valor ?? ''), seguro=/^[\t\r ]*[=+\-@]/.test(t) ? "'"+t : t; return '"'+seguro.replace(/"/g,'""')+'"'; }
function prExportarCSV(){

function prExportarRespaldo(){

  const url=URL.createObjectURL(new Blob([JSON.stringify(datos,null,2)],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='respaldo-calendario-redes.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Respaldo completo descargado');

async function prImportarRespaldo(e){

(function(){

/* =========================================================
   «DISEÑAR» DESDE EL CALENDARIO: EL DISEÑO SALE ARMADO
   Antes solo se copiaba el texto y había que pegarlo en una plantilla.
   Ahora se elige un estilo y se arma un diseño editable con:
   - la medida de la red y el formato (historia 1080×1920, Instagram 1080×1350, X 1600×900…),
   - el tema como título, el texto, la llamada a la acción y los hashtags, ya acomodados.
   «Mi marca» usa los colores, letras y logo del Kit de marca.
   También regresa el botón Sencillo/Completo a la barra de arriba en la computadora.
   ========================================================= */
function medidaPost(p){
  const f = p.formato || '', r = p.plataforma || '';
  if (/Historia|Reel/.test(f) || r === 'TikTok') return [1080, 1920];

    const url = vistaDe([w, h], () => armarDiseno(c, k, w, h, true));
    const b = document.createElement('button'); b.type = 'button'; b.className = 'diResultado';
    b.innerHTML = `<img alt="Diseño estilo ${esc(ESTILOS_POST[k].nombre)}" src="${url}"><span>${esc(ESTILOS_POST[k].nombre)}${k === c.estilo ? ' · sugerido' : ''}</span>`;
    b.onclick = () => usarDisenoIA(k);
    cont.appendChild(b);
  }
  cont.hidden = false; btn.disabled = false;
  btn.innerHTML = `${svgIcono('ciclo')} Crear otra vez`;
  if (!/no respondió/.test($('diEstado').textContent)) $('diEstado').textContent = `Listo: ${fmt.nombre} de ${w} × ${h} px. Toca el que más te guste; después puedes cambiar todo.`;
  cont.querySelector('button').focus();
}
function usarDisenoIA(k){
  if (!disenoIA) return;
  if (typeof hayDisenoInicio === 'function' && hayDisenoInicio()){
    const nom = ($('nombreDiseno').value || 'Mi diseño').trim();
    if (!confirm(`Tu diseño «${nom}» se va a cambiar por el nuevo. Si lo quieres conservar, toca «Cancelar» y guárdalo primero.`)) return;
  }
  cerrarModal('mDisenoIA');
  if (typeof disenoEnBlanco === 'function') disenoEnBlanco();
  if (typeof cerrarInicio === 'function' && $('inicioApp') && !$('inicioApp').hidden) cerrarInicio();
  armarDiseno(disenoIA.c, k, disenoIA.w, disenoIA.h);
  if (typeof hechoPP === 'function') hechoPP('ia');
  toast('✓ Tu diseño está listo. Toca cualquier texto para cambiarlo.');
}
// entradas: página de inicio (atajo y botón grande), Archivo y buscador de herramientas
(function(){
  const atajos = document.querySelector('#inicioApp .inAtajos');
  if (atajos){ const b = document.createElement('button'); b.type = 'button'; b.textContent = '🪄 Diseño con IA'; b.onclick = () => abrirDisenoIA(); const r = atajos.querySelector('button'); atajos.insertBefore(b, r); }
  const busca = document.querySelector('#inicioApp .inBusca');
  if (busca){
    const b = document.createElement('button'); b.type = 'button'; b.id = 'inDisenoIA'; b.className = 'inDisenoIA';
    b.innerHTML = `${svgIcono('varita')}<span><b>¿No encuentras lo que buscas?</b> Descríbelo y la IA te arma el diseño</span>`;
    b.onclick = () => { const q = ($('inTexto') || {}).value || ''; abrirDisenoIA(); if (q.trim()) $('diPeticion').value = q.trim(); };
    busca.insertAdjacentElement('afterend', b);
  }
  const mp = $('maPrincipal');
  if (mp){ const a = document.createElement('button'); a.className = 'tb'; a.type = 'button'; a.id = 'bDisenoIA'; a.innerHTML = `${svgIcono('varita')} Diseño con IA`; a.onclick = () => abrirDisenoIA(); mp.prepend(a); }
})();
</script>
