let promesaMV = null;
function cargarModelViewer(){
  if (customElements.get('model-viewer')) return Promise.resolve();
  return promesaMV = promesaMV || new Promise((ok, mal) => {
    const s = document.createElement('script'); s.src = URL_MV;
    s.onload = () => customElements.whenDefined('model-viewer').then(ok);
    s.onerror = () => { promesaMV = null; mal(new Error('No se pudo cargar el visor 3D. Revisa tu conexión a internet.')); };
    document.head.appendChild(s);
  });
}
// ---------- modelo 3D: en el editor se ve como una foto (póster) y en la página web gira de verdad ----------
function posterVacio3D(w, h, texto, comoCanvas){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, 'rgba(99,102,241,.18)'); g.addColorStop(1, 'rgba(236,72,153,.18)');
  x.fillStyle = g; x.fillRect(0, 0, w, h); x.strokeStyle = 'rgba(99,102,241,.6)'; x.setLineDash([12, 8]); x.lineWidth = 3; x.strokeRect(2, 2, w - 4, h - 4);
  x.fillStyle = '#4f46e5'; x.textAlign = 'center'; x.font = `${Math.round(Math.min(w, h) / 5)}px sans-serif`; x.fillText('🧊', w / 2, h / 2);
  x.font = `600 ${Math.max(14, Math.round(Math.min(w, h) / 16))}px Inter, sans-serif`; x.fillText(texto || 'Cargando modelo 3D…', w / 2, h / 2 + Math.min(w, h) / 8);
  return comoCanvas ? c : c.toDataURL('image/png');
}
async function fotoDeModelo(cfg, w, h, color){
  await cargarModelViewer();

  mv.style.cssText = `position:fixed;left:0;top:0;width:${Math.round(w * k)}px;height:${Math.round(h * k)}px;opacity:.01;pointer-events:none;z-index:-1;background:transparent`;
  mv.setAttribute('src', cfg.src); mv.setAttribute('camera-orbit', cfg.camara || '30deg 75deg auto'); mv.setAttribute('shadow-intensity', '1');
  mv.setAttribute('exposure', '1.1'); mv.setAttribute('interaction-prompt', 'none'); mv.setAttribute('disable-tap', '');
  document.body.appendChild(mv);

    await new Promise((ok, mal) => { mv.addEventListener('load', ok, { once:true }); mv.addEventListener('error', () => mal(new Error('No se pudo abrir el modelo 3D (usa un archivo .glb)')), { once:true }); setTimeout(() => mal(new Error('El modelo 3D tardó demasiado')), 25000); });
    if (color) pintarModelo(mv, color, cfg.material);

    for (let i = 0; i < 3; i++) await new Promise(r => requestAnimationFrame(r));

  } finally { mv.style.visibility = 'hidden'; setTimeout(() => mv.remove(), 3000); }
}
function pintarModelo(mv, color, mat){

  const c = new fabric.Color(color).getSource(); m.pbrMetallicRoughness.setBaseColorFactor([c[0] / 255, c[1] / 255, c[2] / 255, 1]);
}

async function actualizarPoster(o, w, h){

function subirModelo3D(file){

  if (file.size > MAX_GLB) return toast('El modelo pesa ' + (file.size / 1048576).toFixed(1) + ' MB. Usa uno de menos de 8 MB, o pega su dirección web con «🔗 Modelo desde internet».');

}

// ---------- cambiador de productos (fotos que se cambian y el fondo cambia de color) ----------
function colorDominante(img){
  const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d');
  try { x.drawImage(img, 0, 0, 32, 32); const d = x.getImageData(0, 0, 32, 32).data; let r = 0, g = 0, b = 0, n = 0;
    for (let i = 0; i < d.length; i += 4){ if (d[i + 3] < 128) continue; const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]);
      const w = (mx - mn) + 8; if (mx > 245 && mn > 235) continue; r += d[i] * w; g += d[i + 1] * w; b += d[i + 2] * w; n += w; }
    if (!n) return '#f3f4f6';
    const mez = v => Math.round(v / n * 0.35 + 255 * 0.65);
    return '#' + [mez(r), mez(g), mez(b)].map(v => v.toString(16).padStart(2, '0')).join('');
  } catch (e) { return '#f3f4f6'; }
}
function grupoCambiador(variantes, w, h, i0){

}
async function crearCambiador(){

    const el = o.getElement(); return { src:o.toDataURL({ format:'png', multiplier:Math.min(2, 900 / Math.max(o.getScaledWidth(), o.getScaledHeight())) }), fondo:colorDominante(el), nombre:o.name || '' }; });

  const c = canvas.getActiveObject().getCenterPoint();

}
function editarFondosCambiador(){

function editarColores3D(){

  const r = prompt('Colores del producto (la persona los elige en la página web). Escribe nombre=color de producto/color de fondo, separados por comas.\nEjemplo: Cereza=#d61f1f/#ffe1e1, Limón=#3fae2a/#e6f9dc\nDéjalo vacío para quitar los colores.',
    (m.colores || []).map(c => `${c.nombre}=${c.color}/${c.fondo}`).join(', '));

  const borde = o.stroke && o.strokeWidth ? `-webkit-text-stroke:${o.strokeWidth}px ${o.stroke};paint-order:stroke fill;` : '';

  delete $('archivo3D').dataset.reemplazar;
  return subirModelo3DBase(file);
};
renderCatalogo();

/* =========================================================
   ACCESIBILIDAD Y USO CON EL DEDO
   ========================================================= */
(function(){
  // nombres para lectores de pantalla en botones que solo tienen un símbolo
  const nombrar = raiz => (raiz || document).querySelectorAll('button:not([aria-label])').forEach(b => {
    const t = (b.textContent || '').trim();
    if (b.title) b.setAttribute('aria-label', b.title);
    else if (t === '−' || t === '-') b.setAttribute('aria-label', 'Alejar');
    else if (t === '+') b.setAttribute('aria-label', 'Acercar');
  });
  nombrar();
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) nombrar(n.parentNode || n); }))).observe(document.body, { childList:true, subtree:true });
  // los avisos se leen en voz alta
  const t = $('toast'); if (t){ t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); }
  // pestañas: se anuncia cuál está abierta
  const nav = $('pestanas'); if (nav){ nav.setAttribute('aria-label', 'Herramientas');
    const marcar = () => nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.classList.contains('activa') ? 'true' : 'false'));
    marcar(); new MutationObserver(marcar).observe(nav, { attributes:true, subtree:true, attributeFilter:['class'] }); }
  // los botones del celular no tapan la barra de páginas
  const ajustarFab = () => { const p = $('paginas'), a = $('accMovil'); if (!p || !a || innerWidth > 820) { if (a){ a.style.bottom = ''; a.style.visibility = ''; } return; }
    const n = $('barraNotas'), ref = n && n.offsetParent ? n : p, r = ref.getBoundingClientRect();
    a.style.bottom = Math.max(76, innerHeight - r.top + 10) + 'px';
    a.style.visibility = $('lateral') && $('lateral').classList.contains('abierto') ? 'hidden' : ''; };
  new MutationObserver(ajustarFab).observe($('lateral'), { attributes:true, attributeFilter:['class'] });
  addEventListener('resize', ajustarFab); setInterval(ajustarFab, 1500); ajustarFab();
})();

const ICONOS_UI = {

  deshacer:'M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3', rehacer:'M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3',

  notas:'M6 3h9l4 4v14H6zM9 12h7M9 16h5', mas:'M12 5v14M5 12h14', menos:'M5 12h14',
  plantillas:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z', texto:'M5 7V4h14v3M12 4v16M9 20h6',
  formas:'M4 13h7v7H4zM16.5 4a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7zM7.5 3l3.5 6H4z',
  elementos:'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z',
  dibujar:'M4 20c0-3 1-4.5 3-5l9-9 3 3-9 9c-.5 2-2 3-6 2zM14 8l2 2',
  imagen:'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15.5 8.5h.01', diagramas:'M4 4h6v5H4zM14 15h6v5h-6zM7 9v3h10v3',
  fondo:'M4 4h16v16H4zM4 15l5-5 11 11M14 4l6 6', marca:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
  monitor:'M3 4h18v12H3zM8 20h8M12 16v4', listo:'M5 12l5 5 9-10', cerrar:'M6 6l12 12M18 6 6 18'
};
const GLIFO_ICONO = { '📂':'carpeta', '💾':'guardar', '↶':'deshacer', '↷':'rehacer', '🔍':'buscar', '❤':'corazon', '❤️':'corazon', '🔗':'enlace', '▶':'play',
  '⬇':'descargar', '⬆':'subir', '⤢':'ajustar', '🗑':'basura', '🗑️':'basura', '⧉':'duplicar', '✎':'lapiz', '◀':'izq', '📝':'notas', '＋':'mas', '+':'mas', '−':'menos', '▦':'plantillas' };
const GLIFO_PESTANA = { tPlantillas:'plantillas', tTexto:'texto', tFormas:'formas', tElementos:'elementos', tDibujar:'dibujar', tImagenes:'imagen',
  tDiagramas:'diagramas', tFondo:'fondo', tMarca:'marca', tWeb:'monitor' };
function svgIcono(n){ return `<svg class="ico${n === 'play' ? ' relleno' : ''}" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="${ICONOS_UI[n]}"/></svg>`; }
(function(){
  const ZONAS = '#barra, #pestanas, #accMovil, #paginas, #barraNotas, #props .grupoBtns, #props .fila, #fila3D, #lateral .bigbtn';
  const glifos = Object.keys(GLIFO_ICONO).sort((a, b) => b.length - a.length);
  function convertir(b){
    if (b.querySelector('svg.ico')) return;
    const tab = b.closest('#pestanas') && b.dataset.tab;
    if (tab && GLIFO_PESTANA[tab]){ const s = b.querySelector('span'); if (s){ s.innerHTML = svgIcono(GLIFO_PESTANA[tab]); } return; }
    const n = [...b.childNodes].find(x => x.nodeType === 3 && x.textContent.trim());
    if (!n || n !== [...b.childNodes].find(x => x.nodeType !== 3 || x.textContent.trim())) return;
    const t = n.textContent.replace(/^\s+/, '');
    const g = glifos.find(x => t.startsWith(x) && (t.length === x.length || /\s|️/.test(t[x.length])));
    if (!g) return;
    if ((g === '+' || g === '−') && t.trim().length > 1 && !/^[+−]\s/.test(t)) return;
    const resto = t.slice(g.length).replace(/^️/, '');
    const sp = document.createElement('span'); sp.className = 'icoCaja'; sp.innerHTML = svgIcono(GLIFO_ICONO[g]);
    b.insertBefore(sp, n); n.textContent = resto.trim() ? ' ' + resto.trim() : '';
    if (!resto.trim() && !b.getAttribute('aria-label') && b.title) b.setAttribute('aria-label', b.title);
  }
  const todos = raiz => raiz.querySelectorAll('button').forEach(b => { if (b.matches(ZONAS.split(',').map(z => z.trim() + ' button, ' + z.trim()).join(','))) convertir(b); });
  todos(document);
  let pend = false;
  new MutationObserver(() => { if (pend) return; pend = true; requestAnimationFrame(() => { pend = false; todos(document); }); })
    .observe(document.body, { childList:true, subtree:true, characterData:true });
})();

/* =========================================================
   BARRA DE ARRIBA ADAPTABLE: lo que no cabe pasa al menú «Más»
   ========================================================= */
(function(){
  const barra = $('barra'); if (!barra) return;
  // agrupar el zoom y deshacer/rehacer para que se muevan juntos
  const agrupar = (id, els) => { els = els.filter(Boolean); if (!els.length) return null; const g = document.createElement('div'); g.id = id; g.className = 'grupoBarra';
    els[0].before(g); els.forEach(e => g.appendChild(e)); return g; };
  const hijos = [...barra.children];
  const porClick = t => hijos.find(e => e.tagName === 'BUTTON' && (e.getAttribute('onclick') || '').includes(t));
  agrupar('grupoHist', [$('bDeshacer'), $('bRehacer')]);
  agrupar('grupoZoom', [porClick('cambiarZoom(-0.1)'), $('zoomTxt'), porClick('cambiarZoom(0.1)')]);
  hijos.forEach(b => { if (b.tagName === 'BUTTON' && !b.title){ const t = b.textContent.trim(); if (t) { b.title = t; b.setAttribute('aria-label', t); } } });
  // fabric 5.3.1 usa un valor que el navegador no reconoce y llena la consola de avisos: se corrige
  try { const f = fabric.Text.prototype._setTextStyles, src = f.toString();
    if (/(["'])alphabetical\1/.test(src)) fabric.Text.prototype._setTextStyles = (0, eval)('(' + src.replace(/^_setTextStyles\s*\(/, 'function(').replace(/(["'])alphabetical\1/, '"alphabetic"') + ')');
  } catch (e) {}
  // botón «Más» y su menú
  const mas = document.createElement('button'); mas.className = 'tb'; mas.id = 'bMas'; mas.hidden = true;
  mas.title = 'Más opciones'; mas.setAttribute('aria-label', 'Más opciones'); mas.setAttribute('aria-haspopup', 'true'); mas.setAttribute('aria-expanded', 'false');
  mas.innerHTML = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01" style="stroke-width:3.2"/></svg><span class="txtMas"> Más</span>';
  const menu = document.createElement('div'); menu.id = 'menuMas'; menu.setAttribute('role', 'menu'); menu.hidden = true;
  document.body.appendChild(menu);
  // prioridad: el número más bajo se va primero al menú
  const PRIOR = [
    [e => e.tagName === 'BUTTON' && e.getAttribute('onclick') === "abrirModal('mAyuda')", 1],
    [e => e.id === 'bAuto', 2], [e => (e.getAttribute('onclick') || '').includes('ajustarLienzoAContenido'), 3],
    [e => (e.getAttribute('onclick') || '').includes('abrirBuscar'), 4], [e => e.id === 'bInstalar', 5],
    [e => e.classList.contains('donar'), 6], [e => e.id === 'tamTxt', 7], [e => (e.getAttribute('onclick') || '') === 'nuevoDiseno()', 8],
    [e => (e.getAttribute('onclick') || '') === 'ajustarZoom()', 9], [e => e.id === 'grupoZoom', 10], [e => e.id === 'bNube', 11],
    [e => (e.getAttribute('onclick') || '').includes('mCompartir'), 12], [e => (e.getAttribute('onclick') || '').includes('mProyectos'), 13],
    [e => e.id === 'grupoHist', 14], [e => (e.getAttribute('onclick') || '').includes('mPresentar'), 15]
  ];
  const prioridad = e => { for (const [f, p] of PRIOR) if (f(e)) return p; return 0; };
  const todos = [];        // orden original de la barra
  const registrar = () => {
    [...barra.children].forEach(e => {
      if (todos.includes(e)) return;
      const prev = e.previousElementSibling, k = todos.indexOf(prev);
      todos.splice(k >= 0 ? k + 1 : todos.length, 0, e);
    });
    // «Más» y «Exportar» siempre al final, a la derecha
    const exp = todos.find(e => (e.getAttribute('onclick') || '').includes('mExportar'));
    [mas, exp].forEach(e => { if (!e) return; const k = todos.indexOf(e); if (k >= 0) todos.splice(k, 1); todos.push(e); });
  };
  const etiquetar = e => {        // en el menú, los botones de solo ícono muestran su nombre
    const bs = e.tagName === 'BUTTON' ? [e] : [...e.querySelectorAll('button')];
    bs.forEach(b => { if (b.id !== 'tamTxt' && !b.querySelector('.etqMenu') && b.title && !(b.textContent || '').replace(/\s/g, '').match(/[\p{L}]{3,}/u)){
      const s = document.createElement('span'); s.className = 'etqMenu'; s.textContent = ' ' + b.title.replace(/\s*\(.*\)$/, ''); b.appendChild(s); } });
  };
  let acomodando = false;
  function acomodar(){
    if (acomodando) return; acomodando = true;
    registrar();
    todos.forEach(e => barra.appendChild(e));            // todo regresa a la barra en su orden
    mas.hidden = true; barra.classList.remove('apretada');
    const cabe = () => barra.scrollWidth <= barra.clientWidth + 1;
    const lista = todos.filter(e => prioridad(e)).sort((a, b) => prioridad(a) - prioridad(b));
    if (!cabe()) barra.classList.add('apretada');          // primero se esconde el texto «Guardado…»
    let i = 0;
    while (!cabe() && i < lista.length){ mas.hidden = false; menu.appendChild(lista[i]); etiquetar(lista[i]); i++; }
    [...menu.children].sort((a, b) => todos.indexOf(a) - todos.indexOf(b)).forEach(e => menu.appendChild(e));
    barra.classList.remove('soloIconos');
    if (!cabe()) barra.classList.add('soloIconos');        // pantallas muy angostas: Guardar y Exportar solo con ícono
    acomodando = false;
  }
  const abrir = v => {
    menu.hidden = !v; mas.setAttribute('aria-expanded', v ? 'true' : 'false');
    if (v){ const r = mas.getBoundingClientRect(); menu.style.top = (r.bottom + 6) + 'px';
      if (innerWidth < 560){ menu.style.left = '8px'; menu.style.right = '8px'; menu.style.maxWidth = 'none'; }
      else { menu.style.left = 'auto'; menu.style.right = Math.max(8, innerWidth - r.right) + 'px'; menu.style.maxWidth = Math.max(240, r.right - 8) + 'px'; }
      const f = menu.querySelector('button'); f && f.focus({ preventScroll:true }); }
  };
  mas.onclick = e => { e.stopPropagation(); abrir(menu.hidden); };
  menu.addEventListener('click', e => { if (e.target.closest('button') && !e.target.closest('#grupoZoom')) abrir(false); });
  document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target) && e.target !== mas) abrir(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden){ abrir(false); mas.focus(); } });
  let t = null; const pedir = () => { clearTimeout(t); t = setTimeout(() => { abrir(false); acomodar(); }, 60); };
  addEventListener('resize', pedir);
  new MutationObserver(ms => { if (!acomodando && ms.some(m => [...m.addedNodes].some(n => n.nodeType === 1 && n.parentNode === barra && !todos.includes(n)))) pedir(); })
    .observe(barra, { childList:true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(pedir);
  acomodar(); setTimeout(acomodar, 800); setTimeout(acomodar, 2500);
  window.acomodarBarra = acomodar;
})();

</script>
